services:
  postgres:
    image: postgres:16.1
    container_name: prod_postgres
    restart: always
    volumes:
      - zm_db:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=monddb
      - POSTGRES_USER=mond
      - POSTGRES_PASSWORD=${DB_PASSWORD}

  redis:
    image: redis:7-alpine
    container_name: prod_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - zm_redis:/data

  zm:
    hostname: zirkusmond_de
    image: ${DOCKER_USERNAME}/zirkusmond:latest
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - zm_media:/srv/data
      - zm_logs:/var/log/zirkusmond
    depends_on:
      - postgres
      - redis

  celery_worker:
    image: ${DOCKER_USERNAME}/zirkusmond:latest
    container_name: prod_celery_worker
    working_dir: /usr/src/backend
    command: celery -A config worker --loglevel=info
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - zm_logs:/var/log/zirkusmond
    depends_on:
      - postgres
      - redis

  celery_beat:
    image: ${DOCKER_USERNAME}/zirkusmond:latest
    container_name: prod_celery_beat
    working_dir: /usr/src/backend
    command: celery -A config beat --loglevel=info
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - zm_logs:/var/log/zirkusmond
    depends_on:
      - postgres
      - redis

  listmonk:
    image: listmonk/listmonk:latest
    container_name: prod_listmonk
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      - TZ=Europe/Berlin
      - LISTMONK_app__address=0.0.0.0:9000
      - LISTMONK_db__host=prod_postgres
      - LISTMONK_db__port=5432
      - LISTMONK_db__user=mond
      - LISTMONK_db__password=${DB_PASSWORD}
      - LISTMONK_db__database=listmonk_db
      - LISTMONK_db__ssl_mode=disable
    env_file:
      - .env
    volumes:
      - zm_listmonk_data:/listmonk
    depends_on:
      - postgres
    command: ["./listmonk"]

networks:
  default:
    external: true
    name: ubuntu_default

volumes:
  zm_media:
    external: true
    name: ubuntu_zm_media
  zm_db:
    external: true
    name: ubuntu_zm_db
  zm_redis:
    external: true
    name: ubuntu_zm_redis
  zm_logs:
    external: true
    name: ubuntu_zm_logs
  zm_listmonk_data:
    external: true
    name: ubuntu_zm_listmonk_data
