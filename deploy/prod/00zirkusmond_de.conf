server {
    listen 80;
    server_name zirkusmond.de www.zirkusmond.de;

    location /.well-known/acme-challenge/ {
        root /var/www/acme-challenge;
    }

    location / {
        return 301 https://zirkusmond.de$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name zirkusmond.de;

    ssl_certificate /certs/zirkusmond.de/fullchain.pem;
    ssl_certificate_key /certs/zirkusmond.de/privkey.pem;

    http2 on;

    # Block scanner traffic before it reaches Django
    location ~ /\. { return 444; }
    location ~ \.(php|asp|aspx|jsp|cgi|cfm)$ { return 444; }
    location ~ ^/(wp-admin|wp-login\.php|xmlrpc\.php|phpmyadmin|adminer|myadmin) { return 444; }
    location ~ ^/(proc|etc|sys)/ { return 444; }

    location /static/ {
        resolver 127.0.0.11 valid=10s;
        set $upstream zirkusmond_de:8000;
        proxy_pass http://$upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /media/ {
        resolver 127.0.0.11 valid=10s;
        set $upstream zirkusmond_de:8000;
        proxy_pass http://$upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        resolver 127.0.0.11 valid=10s;
        set $upstream zirkusmond_de:8000;
        proxy_pass http://$upstream;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;

        proxy_read_timeout      4600;
        proxy_connect_timeout   600;

        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto   $scheme;

        client_max_body_size 10M;
    }
}

