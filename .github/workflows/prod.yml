name: production

on:
  push:
    branches:
      - prod

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: cd backend && uv sync

      - name: Run tests
        run: cd backend && uv run pytest

  build_and_deploy_image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Prepare .env files
        run: |
          # Backend .env
          cp deploy/.env.basic .env
          echo "" >> .env
          echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" >> .env
          echo "DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "BREVO_API_KEY=${{ secrets.BREVO_API_KEY }}" >> .env
          echo "STRIPE_SECRET_KEY=${{ secrets.STRIPE_LIVE_SECRET_KEY }}" >> .env
          echo "STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}" >> .env
          echo "LISTMONK_URL=http://prod_listmonk:9000" >> .env
          echo "LISTMONK_API_USERNAME=${{ secrets.LISTMONK_API_USERNAME }}" >> .env
          echo "LISTMONK_API_PASSWORD=${{ secrets.LISTMONK_API_PASSWORD }}" >> .env
          echo "LISTMONK_LIST_ID=1" >> .env
          echo "DB_HOST=prod_postgres" >> .env
          echo "DJANGO_SETTINGS_MODULE=config.settings.production" >> .env
          echo "API_URL=http://localhost:8010" >> .env
          echo "FRONTEND_URL=https://zirkusmond.de" >> .env
          echo "CELERY_BROKER_URL=redis://prod_redis:6379/0" >> .env
          echo "CELERY_RESULT_BACKEND=redis://prod_redis:6379/0" >> .env
          echo "SENTRY_DSN_BACKEND=${{ secrets.SENTRY_DSN_BACKEND }}" >> .env
          echo "SENTRY_ORG=zirkusmond" >> .env
          echo "SENTRY_PROJECT=python-django" >> .env
          echo "SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}" >> .env
          echo "LOG_DIR=/var/log/zirkusmond" >> .env

          # Frontend .env
          echo "VITE_STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_LIVE_PUBLISHABLE_KEY }}" >> .env
          echo "VITE_API_URL=https://zirkusmond.de/api"  >> .env
          echo "VITE_SENTRY_DSN=${{ secrets.SENTRY_DSN_FRONTEND }}" >> .env

      - name: Build Zirkusmond image
        run: |
          docker build -f deploy/Dockerfile \
            --build-arg VITE_STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_LIVE_PUBLISHABLE_KEY }} \
            --build-arg VITE_API_URL=https://zirkusmond.de/api \
            --build-arg VITE_SENTRY_DSN=${{ secrets.SENTRY_DSN_FRONTEND }} \
            --build-arg SENTRY_ORG=zirkusmond \
            --build-arg SENTRY_PROJECT=zm-tanstackstart-react \
            --build-arg SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }} \
            -t ${{ secrets.DOCKER_USERNAME }}/zirkusmond:latest .

      - name: Push to registry
        run: docker push ${{ secrets.DOCKER_USERNAME }}/zirkusmond:latest

      - name: Copy .env to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: ".env"
          target: "~/zirkusmond/"

      - name: Copy docker-compose to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy/prod/docker-compose.yml"
          target: "~/zirkusmond/"
          strip_components: 2

      - name: Copy nginx config to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy/prod/00zirkusmond_de.conf"
          target: "/home/ubuntu/nginx/sites.d/"
          strip_components: 2

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/zirkusmond
            docker compose pull
            docker compose up -d --pull always
            docker image prune -f
            docker exec nginx-nginx-1 nginx -s reload || true
