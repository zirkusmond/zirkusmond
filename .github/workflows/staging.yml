name: staging

on:
  push:
    branches:
      - staging

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: cd backend && uv sync

      # - name: Run tests
      #   run: cd backend && uv run pytest

  build_and_deploy_image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Prepare .env files
        run: |
          # Backend .env
          cp deploy/.env.basic .env
          echo "" >> .env
          echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" >> .env
          echo "DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "BREVO_API_KEY=${{ secrets.BREVO_API_KEY }}" >> .env
          echo "PAYPAL_SANDBOX_CLIENT_ID=${{ secrets.PAYPAL_SANDBOX_CLIENT_ID }}" >> .env
          echo "PAYPAL_SANDBOX_SECRET=${{ secrets.PAYPAL_SANDBOX_SECRET }}" >> .env
          echo "STRIPE_TEST_SECRET_KEY=${{ secrets.STRIPE_TEST_SECRET_KEY }}" >> .env
          echo "STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_TEST_WEBHOOK_SECRET }}" >> .env
          echo "LISTMONK_URL=http://staging_listmonk:9000"" >> .env
          echo "LISTMONK_API_USERNAME=${{ secrets.LISTMONK_API_USERNAME }}" >> .env
          echo "LISTMONK_API_PASSWORD=${{ secrets.LISTMONK_API_PASSWORD }}" >> .env
          echo "LISTMONK_LIST_ID=3" >> .env
          echo "DB_HOST=staging_postgres" >> .env
          echo "DJANGO_SETTINGS_MODULE=config.settings.staging" >> .env
          echo "API_URL=http://localhost:8010" >> .env
          echo "FRONTEND_URL=https://testing.zirkusmond.de" >> .env
          echo "CELERY_BROKER_URL=redis://staging_redis:6379/0" >> .env
          echo "CELERY_RESULT_BACKEND=redis://staging_redis:6379/0" >> .env

          echo "VITE_STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}" >> .env
          echo "VITE_API_URL=https://testing.zirkusmond.de/api" >> .env

      - name: Build Django image
        run: |
          docker build -f deploy/Dockerfile \
            --build-arg VITE_STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }} \
            --build-arg VITE_API_URL=https://testing.zirkusmond.de/api \
            -t ${{ secrets.DOCKER_USERNAME }}/zirkusmond:staging .

      - name: Push to registry
        run: docker push ${{ secrets.DOCKER_USERNAME }}/zirkusmond:staging

      - name: Copy .env to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: ".env"
          target: "~/staging_zirkusmond/"

      - name: Copy docker-compose to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy/staging/docker-compose.yml"
          target: "~/staging_zirkusmond/"
          strip_components: 2

      - name: Copy nginx config to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy/staging/03staging_zirkusmond.conf"
          target: "/home/ubuntu/nginx/sites.d/"
          strip_components: 2

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/staging_zirkusmond
            docker compose pull
            docker compose up -d postgres redis
            until docker compose exec -T postgres pg_isready -U mond; do sleep 2; done
            docker compose stop zm celery_worker celery_beat || true
            docker exec prod_postgres pg_dump -U mond monddb > ~/zirkusmond_latest.sql
            docker compose exec -T postgres psql -U mond -d postgres -c "DROP DATABASE IF EXISTS monddb;"
            docker compose exec -T postgres psql -U mond -d postgres -c "CREATE DATABASE monddb;"
            docker compose exec -T postgres psql -U mond monddb < ~/zirkusmond_latest.sql
            docker run --rm -v ubuntu_zm_media:/src:ro -v staging_zirkusmond_zm_media:/dst alpine sh -c "mkdir -p /dst/media && cp -a /src/media/. /dst/media/"
            docker compose up -d --remove-orphans
            docker image prune -f
            docker exec nginx-nginx-1 nginx -s reload || true
