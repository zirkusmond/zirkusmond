[project]
name = "zirkusmond"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django-payments==3.1.0",
    "jupyter_nbextensions_configurator==0.6.4",
    "django_extensions==4.1",
    "xlsxwriter==3.2.9",
    "gunicorn==26.0.0",
    "imaplib2==3.6",
    "xmltodict==1.0.4",
    "psycopg2-binary==2.9.12",
    "stripe==14.4.1",
    "qrcode[pil]==8.2",
    "django-tinymce==5.0.0",
    "reportlab==4.5.1",
    "django-anymail==15.0",
    "django-unfold>=0.97.0",
    "djangorestframework>=3.17.1",
    "django-cors-headers>=4.9.0",
    "requests>=2.32.0",
    "pillow>=12.2.0",
    "sentry-sdk>=2.69.0",
    "django>=5.2.15",
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP"]
ignore = ["F403", "F405", "E501"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["E501"]
"*/migrations/*.py" = ["E501", "N806"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
check_untyped_defs = true
# Only type-check models/views/serializers/services/etc. — skip migrations and the
# standard Django boilerplate files (settings, urls.py, apps.py, wsgi/asgi, manage.py,
# celery.py) plus test files, which aren't business logic.
exclude = [
    "/migrations/",
    "^config/settings/",
    "(^|/)urls\\.py$",
    "(^|/)apps\\.py$",
    "(^|/)wsgi\\.py$",
    "(^|/)asgi\\.py$",
    "(^|/)manage\\.py$",
    "^config/celery\\.py$",
    "(^|/)tests\\.py$",
    "(^|/)test_[^/]*\\.py$",
]

[tool.django-stubs]
django_settings_module = "config.settings.test"

[dependency-groups]
dev = [
    "pytest-django==4.12.0",
    "pytest-cov==5.0.0",
    "ruff==0.15.18",
    "django-debug-toolbar>=8.0.0",
    "mypy>=1.19.0",
    "django-stubs>=5.2.6",
]
